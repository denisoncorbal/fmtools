spring.datasource.url=${BACKEND_DATABASE_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences[0]=fmtools-backend

app.database-cleanup.enabled=true
app.database-cleanup.cron="0 0 3 * * *"
app.database-cleanup.zone="America/Sao_Paulo"
app.database-cleanup.schema="public"